name: Site Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify deterministic generators
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/build_locale_ui.py
          python scripts/build_product_master.py
          python scripts/apply_evidence_remediation.py
          python scripts/remediate_production_claims.py
          python scripts/normalize_transaction_terms.py
          python scripts/repair_claim_markup.py
          python scripts/add_main_landmarks.py
          python scripts/apply_audit_remediation.py
          python scripts/apply_localization_review_policy.py
          python scripts/generate_hreflang.py
          python scripts/generate_sitemap.py
          git diff --exit-code
      - name: Audit every page
        run: python scripts/audit_website.py
      - name: Audit product contracts and SEO uniqueness
        run: |
          python scripts/audit_commercial_content.py
          python scripts/audit_claims_and_products.py
      - name: Validate blog navigation
        run: python scripts/validate_blog_navigation.py
      - name: Audit localized pages
        run: python scripts/audit_localizations.py
      - name: Enforce performance budgets
        run: python scripts/audit_performance.py
      - name: Audit crawl, metadata, accessibility and asset coverage
        run: |
          python scripts/full_site_audit.py
          python scripts/audit_coverage_gaps.py
